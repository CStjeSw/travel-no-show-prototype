<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norrsken No-Show Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one mobile-first app column with a sticky header and a fixed bottom tab bar; the ops tab widens to two columns on desktop. */
:root {
  --bg: #F2F5F5; --surface: #FFFFFF; --surface-2: #E8EEEF; --fg: #13232A; --muted: #5A6B72; --line: #D3DDE0;
  --accent: #1B6A72; --accent-fg: #FFFFFF; --accent-soft: #D9ECEC;
  --ok: #22744A; --ok-soft: #DDF0E4; --warn: #94600A; --warn-soft: #F9EDD3; --crit: #B0281F; --crit-soft: #FADFDC;
  --shadow: 0 1px 2px rgba(19,35,42,.06), 0 4px 16px rgba(19,35,42,.05);
  --f-ui: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E161A; --surface: #162127; --surface-2: #1D2B32; --fg: #E2EBEE; --muted: #92A3AA; --line: #2A3A42;
  --accent: #5CB5BC; --accent-fg: #05282B; --accent-soft: #173A3E;
  --ok: #5DC48B; --ok-soft: #153324; --warn: #E2A944; --warn-soft: #382A10; --crit: #EF7B72; --crit-soft: #3D1A17;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E161A; --surface: #162127; --surface-2: #1D2B32; --fg: #E2EBEE; --muted: #92A3AA; --line: #2A3A42;
  --accent: #5CB5BC; --accent-fg: #05282B; --accent-soft: #173A3E;
  --ok: #5DC48B; --ok-soft: #153324; --warn: #E2A944; --warn-soft: #382A10; --crit: #EF7B72; --crit-soft: #3D1A17;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.foot { max-width: 640px; margin: 0 auto; padding: 4px 16px 20px; font-size: 12px; color: var(--muted); text-align: center; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-ui); padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; flex: none; }
.brand b { display: block; font-size: 15px; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.picker { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 420px; }
.picker label { font-size: 12px; color: var(--muted); white-space: nowrap; }
select, .input { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; width: 100%; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.ghost:hover { color: var(--fg); border-color: var(--muted); }

/* Main */
.wrap { max-width: 640px; margin: 0 auto; padding-block: 18px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.wrap.wide { max-width: 980px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.lang { font-family: var(--f-data); font-size: 11px; letter-spacing: .04em; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
.btn.sec { background: var(--surface-2); color: var(--fg); }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }

/* Customer phone */
.phone { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.phone-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.ph-name { font-weight: 600; }
.ph-sub { font-size: 12px; color: var(--muted); }
.phone-top .chip { margin-left: auto; }
.thread { display: flex; flex-direction: column; gap: 6px; padding: 14px; background: var(--bg); min-height: 340px; max-height: 58vh; overflow-y: auto; }
.day { align-self: center; font-size: 11px; color: var(--muted); padding: 2px 0 6px; }
.msg { max-width: 84%; padding: 9px 12px; border-radius: 18px; line-height: 1.4; overflow-wrap: anywhere; }
.msg.in { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.out { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 6px; }
.who { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .05em; }
.msg.agent .who { color: var(--accent); }
.stamp { align-self: flex-end; font-size: 11px; color: var(--muted); margin: -2px 2px 4px; display: flex; gap: 8px; align-items: center; }
.stamp.l { align-self: flex-start; }
.stamp .link { font-size: 11px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.slot { border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 500; }
.typing { display: flex; gap: 4px; padding: 12px 14px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
.quick { display: flex; gap: 8px; padding: 10px 14px 0; flex-wrap: wrap; }
.qr { flex: 1 1 0; min-width: 96px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 999px; padding: 8px 10px; font-weight: 600; font-size: 14px; }
.qr:hover, .slot:hover { background: var(--accent-soft); }
.compose { display: flex; gap: 8px; padding: 10px 14px 14px; }
.compose input { flex: 1; border-radius: 999px; padding: 10px 14px; }
.send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

/* AI view */
.quote { margin: 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 10px 10px 0; font-size: 16px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.kv div span { display: block; font-size: 12px; color: var(--muted); }
.kv div b { font-size: 17px; }
.conf { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--muted); border-radius: 4px; }
.bar-row.top .bar i { background: var(--accent); }
.bar-row.top { font-weight: 600; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; }
.tick { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.tick.y { background: var(--ok-soft); color: var(--ok); }
.tick.n { background: var(--warn-soft); color: var(--warn); }
.outcome { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.outcome.auto { background: var(--ok-soft); }
.outcome.auto b { color: var(--ok); }
.outcome.hand { background: var(--accent-soft); }
.outcome.hand b { color: var(--accent); }
.steps { display: grid; gap: 14px; }
.step-h { display: flex; align-items: center; gap: 8px; }
.step-n { width: 22px; height: 22px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr.pick td { background: var(--accent-soft); font-weight: 600; }
tr.excl td { color: var(--muted); }
.y { color: var(--ok); } .n { color: var(--crit); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.pill[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Agent view */
.agent-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.agent-bar select { width: auto; flex: 1 1 200px; }
.inbox { display: grid; gap: 8px; }
.ho { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.ho[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ho.done { opacity: .6; }
.ho-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ho-top b { margin-right: auto; }
.ho p { margin: 0; font-size: 14px; }
.summary { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
.summary .who { color: var(--accent); }
.summary p { margin: 0; font-weight: 500; }
.mini-thread { display: grid; gap: 6px; font-size: 13px; }
.mini-thread div { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.mini-thread div.c { background: var(--bg); border: 1px solid var(--line); }
.mini-thread b { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: block; }
textarea { width: 100%; min-height: 104px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); resize: vertical; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 14px; font-size: 13px; }
.facts span { display: block; color: var(--muted); font-size: 12px; }
.internal { background: var(--warn-soft); border: 1px dashed var(--warn); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.internal .who { color: var(--warn); }
.internal p { margin: 0; }
.esc-form { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.esc-form summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.esc-form .stack { margin-top: 10px; }
.esc-form textarea { min-height: 72px; }
.dept { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 6px; }
.dept:first-of-type { border-top: 0; }
.dept-item { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 13px; display: grid; gap: 2px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Ops */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { display: grid; gap: 4px; align-content: start; }
.kpi .big { font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .big small { font-size: 15px; font-weight: 500; color: var(--muted); }
.ops-grid { display: grid; gap: 18px; }
@media (min-width: 900px) { .ops-grid { grid-template-columns: 1.45fr 1fr; align-items: start; } }
.risk-list { display: grid; }
.risk-list details { border-top: 1px solid var(--line); }
.risk-list summary { list-style: none; display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; cursor: pointer; }
.risk-list summary::-webkit-details-marker { display: none; }
.risk-list summary .nm { min-width: 0; }
.risk-list summary .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.risk-list summary .nm small { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.drivers { padding: 0 2px 12px 62px; display: grid; gap: 8px; font-size: 13px; }
.drivers ul { margin: 0; padding-left: 16px; }
.load-row { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.load-row:first-of-type { border-top: 0; }
.load-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.load-head b { margin-right: auto; }
.lbar { display: flex; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.lbar i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.spark { display: block; width: 100%; max-width: 220px; height: 44px; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 8px 4px 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tab .dot { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--crit); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.toast { position: fixed; left: 0; right: 0; margin-inline: auto; width: fit-content; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 8; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><div class="mark">N</div><div><b>Norrsken Vård</b><small>No-show prevention · prototype</small></div></div>
    <div class="picker" id="picker-row">
      <label for="booking">Booking</label>
      <select id="booking"></select>
    </div>
    <button class="ghost" id="reset" type="button">Reset demo</button>
  </div>
</header>

<main id="main" class="wrap"></main>
<footer class="foot">Concept prototype by Clara Stjernswärd. Fictional company and data. Not affiliated with any real company.</footer>

<nav class="tabs" aria-label="Screens">
  <div class="tabs-in">
    <button class="tab" data-tab="customer" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Customer</button>
    <button class="tab" data-tab="ai" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.5 6.5l2.5 2.5M15 15l2.5 2.5M6.5 17.5 9 15M15 9l2.5-2.5"/></svg>AI handling</button>
    <button class="tab" data-tab="agent" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.5-2 2-5 2"/></svg>Agent<span class="dot" id="agent-dot" hidden></span></button>
    <button class="tab" data-tab="ops" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ops</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

const LEX = {

  billing:    { en: ['price','cost','pay','invoice','insurance','included','fee','how much'], sv: ['pris','priset','kostar','betala','faktura','försäkring','ingår','frikort','avgift'] },
  logistics:  { en: ['parking','park','address','where','find you','bus','train','late','entrance'], sv: ['parkera','parkering','adress','var ligger','hitta','buss','tåg','försenad','entré'] },
  technical:  { en: ['link','login','log in','app','website','video','bankid','password','error','not working','doesn\'t work','won\'t open','browser'], sv: ['länk','länken','logga in','inloggning','appen','hemsidan','video','bankid','lösenord','fungerar inte','funkar inte','öppnas inte'] },

  clinical:   { en: ['pain','medicine','medication','allergy','allergic','reaction','pregnant','anaesthesia','anesthesia','eat','fasting','blood thinner'], sv: ['smärta','ont','medicin','allergi','reaktion','gravid','bedövning','äta','fasta','blodförtunnande'] },
};
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const hits = (t, list) => list.reduce((n, w) => n + (new RegExp('(^|[^\\p{L}])' + reEsc(w) + '(?=$|[^\\p{L}])', 'iu').test(t) ? 1 : 0), 0);
function detectLang(t) {
  if (/[åäö]/i.test(t)) return 'sv';
  const sv = (t.match(/\b(jag|och|det|inte|kan|min|mitt|tid|hej|tack|imorgon|vill|ska|kommer|ja|nej)\b/gi) || []).length;
  const en = (t.match(/\b(i|the|and|is|can|my|time|hi|thanks|tomorrow|want|will|have|yes|no)\b/gi) || []).length;
  return sv > en ? 'sv' : 'en';
}
function analyze(text) {
  const lang = detectLang(text), alt = lang === 'sv' ? 'en' : 'sv';
  const sc = k => hits(text, LEX[k][lang]) + 0.5 * hits(text, LEX[k][alt]);
  const q = { billing: sc('billing'), logistics: sc('logistics'), clinical: sc('clinical'), technical: sc('technical'), legal: sc('legal') };
  const topic = q.legal ? 'legal' : q.technical ? 'technical' : null;   // any mention counts, whatever the intent
  let sub = Object.keys(q).sort((a, b) => q[b] - q[a])[0];
  const hasQ = text.includes('?');
  if (!q[sub]) sub = hasQ ? 'general' : null;
  const s = { confirm: sc('confirm'), reschedule: sc('reschedule'), cancel: sc('cancel'), question: (sub ? Math.max(q[sub] || 0, 0) : 0) + (hasQ ? 0.6 : 0), other: 0.35 };
  const e = Object.fromEntries(Object.entries(s).map(([k, v]) => [k, Math.exp(3.2 * v)]));
  const tot = Object.values(e).reduce((a, b) => a + b, 0);
  const dist = Object.entries(e).map(([k, v]) => [k, v / tot]).sort((a, b) => b[1] - a[1]);
  const intent = dist[0][0];
  return { lang, intent, sub: intent === 'question' ? sub : null, topic, conf: Math.min(0.97, dist[0][1]), dist, source: 'text' };
}
function fakeDist(intent, conf) {
  const w = [0.5, 0.25, 0.15, 0.1];
  return [[intent, conf], ...Object.keys(INTENT).filter(k => k !== intent).map((k, i) => [k, (1 - conf) * w[i]])];
}
const intentLabel = ai => INTENT[ai.intent] + (ai.sub ? ' · ' + SUB[ai.sub] : '') + (ai.topic && ai.topic !== ai.sub ? ' · ' + SUB[ai.topic] + ' topic' : '');

const AUTO = new Set(['confirm', 'reschedule', 'cancel', 'question:logistics', 'question:open']);

function decide(ai, b) {
  const spec = SPECIAL[ai.topic] ? ai.topic : null;

  const policy = spec ? `Mentions a ${SKILL[spec].toLowerCase()} topic, so only ${SKILL[spec].toLowerCase()} specialists may answer`
    : key === 'question:clinical' ? 'Clinical questions always go to a person'
    : ai.intent === 'cancel' ? 'Cancellations get a choice: cancel the booking or book a new time'
    : eligible ? 'Intent can be answered automatically' : 'No automated answer exists for this intent';
  const checks = [
    { ok: confOk, label: confOk ? `Confidence ${pct(ai.conf)} meets the ${pct(THRESH)} threshold` : `Confidence ${pct(ai.conf)} is below the ${pct(THRESH)} threshold` },
    { ok: eligible, label: policy },
  ];
  if (eligible && confOk) return { mode: 'auto', checks };
  const skill = skillFor(ai);
  const cands = AGENTS.map(a => {
    const l = load(a), langOk = a.langs.includes(ai.lang), skillOk = a.skills.includes(skill), excluded = !!spec && !skillOk;
    // Specialists without the customer's language stay eligible (AI translates); everyone else needs the language.
    const score = excluded || (!spec && !langOk) ? 0 : (langOk ? 50 : 0) + (skillOk ? 30 : 0) + Math.max(0, 20 - 4 * l);
    return { id: a.id, l, langOk, skillOk, excluded, score };
  }).sort((x, y) => y.score - x.score);
  const best = spec
    ? cands.find(c => !c.excluded && c.langOk) || cands.find(c => !c.excluded)
    : cands.find(c => c.langOk && c.skillOk) || cands.find(c => c.langOk) || cands[0];
  return { mode: 'handover', checks, skill, cands, agent: best.id, specialist: !!spec, translate: !best.langOk, resolved: false };
}

function processMsg(b, text, o = {}) {
  let ai;
  if (o.button) ai = { lang: b.lang, intent: o.button, sub: o.button === 'question' ? 'open' : null, conf: 1, dist: fakeDist(o.button, 1), source: 'button' };
  else ai = analyze(text);
  if (o.ai) { Object.assign(ai, o.ai); ai.sub = o.ai.sub || null; ai.topic = o.ai.topic || null; ai.dist = fakeDist(ai.intent, ai.conf); }
  ai.summary = o.summary; ai.suggest = o.suggest;
  ai.route = decide(ai, b);
  b.msgs.push({ from: 'customer', text, t: o.t || NOW, ai });
  const L = T[ai.lang], r = ai.route, out = [], done = ['confirmed', 'rescheduled'].includes(b.status);
  if (r.mode === 'auto') {
    if (ai.intent === 'confirm') { out.push({ text: L.confirm(b) }); b.status = 'confirmed'; }
    else if (ai.intent === 'reschedule') { out.push({ text: L.resched(b), slots: true }); b.status = 'slots-offered'; }
    else if (ai.intent === 'cancel') { out.push({ text: L.cancelAsk(b), choice: true }); b.status = 'cancel-offered'; }

  } else {
    out.push({ text: L.handover(agentById(r.agent).name.split(' ')[0]) });
    if (!done) b.status = 'with-agent';
  }
  const replies = out.map(m => ({ from: 'bot', t: o.t || NOW, ...m }));
  r.replies = replies;
  return replies;
}

// ---------- Risk model ----------
function risk(b) {
  if (b.status === 'cancelled') return { score: 0, level: 'none', drivers: [] };
  let s = 8; const d = [];
  const add = (n, why) => { s += n; d.push([n, why]); };
  const last = [...b.msgs].reverse().find(m => m.ai);
  if (b.status === 'pending') add(30, 'No reply to the 24h reminder');
  if (b.prior) add(18 * b.prior, `${b.prior} earlier no-show${b.prior > 1 ? 's' : ''}`);
  if (b.firstVisit) add(8, 'First visit');
  if (b.lead >= 21) add(10, `Booked ${b.lead} days ago`);
  if (last && last.ai.intent === 'cancel' && b.status !== 'rescheduled') add(40, 'Said they may cancel');
  if (b.status === 'with-agent') add(12, 'Open question waiting for an agent');
  if (b.status === 'slots-offered') add(15, 'Asked to move, has not picked a new time');
  if (b.status === 'answered') add(10, 'Question answered, not confirmed');
  if (b.status === 'confirmed' || b.status === 'rescheduled') add(-25, b.status === 'confirmed' ? 'Confirmed by reply' : 'Moved to a new time');
  s = Math.max(4, Math.min(96, s));
  return { score: s, level: s >= 60 ? 'high' : s >= 30 ? 'medium' : 'low', drivers: d };
}
const RISK = { high: ['High', 'crit'], medium: ['Medium', 'warn'], low: ['Low', 'ok'] };

    ? `<div class="slots">${SLOTS.map((s, k) => `<button class="slot" type="button" data-act="slot" data-k="${k}">${esc(s[b.lang])}</button>`).join('')}</div>` : '';
  const choice = m.choice && b.status === 'cancel-offered' && b.msgs.lastIndexOf(m) === b.msgs.findLastIndex(x => x.choice)
    ? `<div class="slots">${T[b.lang].choice.map((c, k) => `<button class="slot" type="button" data-act="cancelchoice" data-k="${k ? 'rebook' : 'cancel'}">${esc(c)}</button>`).join('')}</div>` : '';
  let meta = `<span class="mono">${m.t}</span>`;
  if (m.ai) meta = `<button class="link" type="button" data-act="inspect" data-i="${i}">AI: ${esc(intentLabel(m.ai))} · ${pct(m.ai.conf)}</button>` + meta;
  return `<div class="msg ${cls}">${who ? `<span class="who">${who}</span>` : ''}${esc(m.text)}${slots}${choice}</div><div class="stamp ${m.from === 'customer' ? '' : 'l'}">${meta}</div>`;
}

function viewCustomer() {
  const b = cur(), L = T[b.lang];
  const all = [{ from: 'clinic', reminder: true, text: L.reminder(b), t: '09:00' }, ...b.msgs];
  return `
  <section class="phone" aria-label="Customer SMS conversation">
    <div class="phone-top"><div class="avatar">N</div><div><div class="ph-name">Norrsken Vård</div><div class="ph-sub">SMS to ${esc(b.name)} · <span class="mono">${b.phone}</span></div></div>${langChip(b.lang)}</div>
    <div class="thread" id="thread">
      <div class="day">${L.day}</div>
      ${all.map((m, k) => bubble(m, b, k - 1)).join('')}
      ${S.typing === b.id ? '<div class="msg in typing" aria-label="Typing"><span></span><span></span><span></span></div>' : ''}
    </div>
    <div class="quick">${L.quick.map((q, k) => `<button class="qr" type="button" data-act="quick" data-k="${['confirm', 'reschedule', 'question'][k]}">${q}</button>`).join('')}</div>
    <form class="compose" id="compose"><label class="sr" for="reply">Reply</label><input class="input" id="reply" autocomplete="off" placeholder="${L.ph}">
      <button class="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l2.8 7.2L15 12l-9.2 1.3z"/></svg></button></form>
  </section>
  <p class="hint">Tap a button or write your own reply in English or Swedish, for example “Ingår röntgen i priset?”, “Kan vi flytta till nästa vecka?”, a technical problem like “The video link won’t open” or a legal one like “Kan ni radera mina personuppgifter?”. Tap the AI label under any reply to see how it was handled.</p>`;
}

function viewAI() {
  const b = cur();
  const list = b.msgs.map((m, i) => ({ m, i })).filter(x => x.m.ai);
  if (!list.length) return `<div class="card empty"><b>${esc(b.first)} hasn’t replied yet</b><span>Send a reply from the customer screen to see how the AI reads it and routes it.</span><button class="btn" type="button" data-tab="customer">Open customer screen</button></div>`;
  const pickI = list.some(x => x.i === S.aiMsg) ? S.aiMsg : list[list.length - 1].i;
  const m = b.msgs[pickI], ai = m.ai, r = ai.route;
  const sel = list.length > 1 ? `<div class="pills" role="group" aria-label="Choose reply">${list.map((x, k) => `<button class="pill" type="button" aria-pressed="${x.i === pickI}" data-act="aimsg" data-i="${x.i}">Reply ${k + 1} · <span class="mono">${x.m.t}</span></button>`).join('')}</div>` : '';
  const dist = ai.dist.slice(0, 4).map(([k, p], n) => `<div class="bar-row ${n === 0 ? 'top' : ''}"><span>${INTENT[k]}</span><div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div><span class="mono">${pct(p)}</span></div>`).join('');
  let outcome;
  if (r.mode === 'auto') {
    outcome = `<div class="outcome auto"><b>Answered automatically</b><span class="small">No person needed. The customer got this reply right away:</span></div>
      ${r.replies.map(x => `<div class="msg in" style="max-width:100%"><span class="who">Automated reply</span>${esc(x.text)}${x.choice
        ? `<div class="slots">${T[ai.lang].choice.map(c => `<span class="slot">${esc(c)}</span>`).join('')}</div>` : ''}</div>`).join('')}`;
  } else {
    const ag = agentById(r.agent);
    outcome = `<div class="outcome hand"><b>Handed over to ${esc(ag.name)}</b><span class="small">${matchText(ai, r)}${r.resolved ? ' The agent has replied.' : ''}</span></div>
      <div class="scroll"><table><thead><tr><th>Agent</th><th>${LANG[ai.lang]}</th><th>${SKILL[r.skill]}</th><th>Queue</th><th>Match</th></tr></thead><tbody>
      ${r.cands.map(c => `<tr class="${c.id === r.agent ? 'pick' : c.excluded ? 'excl' : ''}"><td>${esc(agentById(c.id).name)}</td><td class="${c.langOk ? 'y' : 'n'}">${c.langOk ? '✓' : '✕'}</td><td class="${c.skillOk ? 'y' : 'n'}">${c.skillOk ? '✓' : '✕'}</td><td class="mono">${c.l}</td><td class="mono">${c.excluded ? 'Not a specialist' : c.score}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin:0">${r.specialist
        ? `Specialist topic: only agents with the ${SKILL[r.skill]} skill can be matched. Score: language 50 + skill 30 + up to 20 for a short queue. A specialist without the customer’s language can still take it, with AI translation.`
        : 'Match score: language 50 (required) + skill 30 + up to 20 for a short queue.'}</p>
      <div><button class="btn" type="button" data-act="toagent" data-i="${pickI}">Open in agent view</button></div>`;
  }
  return `
  <section class="card stack">
    <div class="row"><h2>Customer reply</h2><span class="muted small" style="margin-left:auto">${esc(b.name)} · SMS · <span class="mono">${m.t}</span></span></div>
    ${sel}
    <blockquote class="quote">${esc(m.text)}</blockquote>
  </section>
  <section class="card steps">
    <div class="step-h"><span class="step-n">1</span><h2>Understand</h2></div>
    <div class="kv">
      <div><span>Language</span><b>${LANG[ai.lang]}</b></div>
      <div><span>Detected intent</span><b>${esc(intentLabel(ai))}</b></div>
      <div><span>Confidence</span><b class="mono">${pct(ai.conf)}</b></div>
      <div><span>Input</span><b>${ai.source === 'button' ? 'Button tap' : 'Free text'}</b></div>
      ${ai.topic ? `<div><span>Specialist topic</span><b>${SKILL[ai.topic]}</b></div>` : ''}
    </div>
    <div class="conf" aria-label="Intent probabilities">${dist}</div>
    <div class="step-h"><span class="step-n">2</span><h2>Decide</h2></div>
    <ul class="checks">${r.checks.map(c => `<li><span class="tick ${c.ok ? 'y' : 'n'}">${c.ok ? '✓' : '!'}</span><span>${esc(c.label)}</span></li>`).join('')}</ul>
    <div class="step-h"><span class="step-n">3</span><h2>Act</h2></div>
    ${outcome}
  </section>`;
}

function viewAgent() {
  const ag = agentById(S.agent);
  const mine = handovers().filter(h => h.m.ai.route.agent === ag.id).sort((x, y) => (x.m.ai.route.resolved - y.m.ai.route.resolved) || mins(x.m.t) - mins(y.m.t));
  const key = h => h.b.id + ':' + h.i;
  let open = mine.find(h => key(h) === S.openH) || mine.find(h => !h.m.ai.route.resolved) || mine[0];
  const head = `<section class="card agent-bar">
    <label for="agent-sel" class="small muted">Signed in as</label>
    <select id="agent-sel">${AGENTS.map(a => `<option value="${a.id}" ${a.id === ag.id ? 'selected' : ''}>${a.name} · ${openFor(a.id)} new</option>`).join('')}</select>
    <div class="row small"><span class="muted">Speaks</span>${ag.langs.map(langChip).join('')}<span class="muted">Skills</span>${ag.skills.map(s => chip(SKILL[s] + (SPECIAL[s] ? ' specialist' : ''), SPECIAL[s] ? 'acc' : '')).join('')}<span class="muted">Queue</span><span class="mono">${load(ag)}/${ag.cap}</span></div>
  </section>`;
  if (!mine.length) return head + `<div class="card empty"><b>No handovers for ${esc(ag.name.split(' ')[0])}</b><span>Handovers arrive here when the AI can’t answer and this agent is the best match for language and skill.</span></div>`;
  const items = mine.map(h => {
    const ai = h.m.ai, wait = mins(NOW) - mins(h.m.t), done = ai.route.resolved;
    return `<button class="ho ${done ? 'done' : ''}" type="button" data-act="openh" data-k="${key(h)}" aria-pressed="${open && key(h) === key(open)}">
      <div class="ho-top"><b>${esc(h.b.name)}</b>${langChip(ai.lang)}${chip(intentLabel(ai), 'acc')}${ai.route.escal ? chip('Escalated · ' + DEPTS[ai.route.escal.dept].name, 'warn') : ''}${done ? chip('Replied', 'ok') : `<span class="chip ${wait >= 15 ? 'crit' : ''} mono">${wait ? wait + ' min' : 'now'}</span>`}</div>
      <p>${esc(summaryFor(h.b, ai))}</p></button>`;
  }).join('');
  const b = open.b, ai = open.m.ai, r = ai.route, rk = risk(b), others = AGENTS.filter(a => a.id !== ag.id && (r.specialist ? a.skills.includes(r.skill) : a.langs.includes(ai.lang)));
  const trail = [{ from: 'clinic', text: T[b.lang].reminder(b), t: '09:00' }, ...b.msgs].slice(-5);
  const detail = `<section class="card stack">
    <div class="row"><h3 style="font-size:18px;margin-right:auto">${esc(b.name)}</h3>${riskChip(rk)}${statusChip(b)}</div>
    <div class="summary"><span class="who">AI summary</span><p>${esc(summaryFor(b, ai))}</p></div>
    <div class="facts">
      <div><span>Appointment</span>Thu 29 Oct · <span class="mono">${b.time}</span></div>
      <div><span>Service</span>${SERVICES[b.svc].en}</div>
      <div><span>Clinic</span>${CLINICS[b.clinic].name}</div>
      <div><span>Routed because</span>${LANG[ai.lang]} · ${SKILL[r.skill]}${r.specialist ? ' specialist' : ''} · ${pct(ai.conf)} conf.${r.translate ? ' · AI translation' : ''}</div>
    </div>
    <details><summary class="small" style="cursor:pointer">Conversation (${b.msgs.length + 1} messages)</summary>
      <div class="mini-thread" style="margin-top:8px">${trail.map(m => `<div class="${m.from === 'customer' ? 'c' : ''}"><b>${m.from === 'customer' ? esc(b.first) : m.from === 'agent' ? esc(agentById(m.agent).name) : m.from === 'bot' ? 'Automated' : 'Reminder'} · ${m.t}</b>${esc(m.text)}</div>`).join('')}</div>
    </details>
    ${r.resolved ? `<div class="outcome auto"><b>Reply sent</b><span class="small">${esc(b.first)} got your answer by SMS.</span></div>` : `
    <label for="agent-reply" class="small muted">${r.translate
      ? `Suggested reply · you can write in ${LANG[ag.langs[0]]}, AI translates it to ${LANG[ai.lang]} before sending`
      : `Suggested reply in ${LANG[ai.lang]} · edit before sending`}</label>
    <textarea id="agent-reply">${esc(suggestFor(b, ai))}</textarea>
    <div class="row"><button class="btn" type="button" data-act="sendreply" data-k="${key(open)}">Send reply</button>
      ${others.length ? `<label for="reassign" class="sr">Reassign</label><select id="reassign" data-k="${key(open)}" style="width:auto"><option value="">Reassign to…</option>${others.map(a => `<option value="${a.id}">${a.name} (${load(a)}/${a.cap})</option>`).join('')}</select>` : ''}</div>`}
    ${r.escal ? `<div class="internal"><span class="who">Escalated to ${DEPTS[r.escal.dept].name} · internal note</span>
        <p>${r.escal.comment ? esc(r.escal.comment) : '<span class="muted">No comment added</span>'}</p>
        <span class="small muted">By ${esc(agentById(r.escal.by).name)} at <span class="mono">${r.escal.t}</span> · not visible to the customer</span></div>`
    : `<details class="esc-form"><summary>Escalate to another department</summary><div class="stack">
        <label for="esc-dept" class="small muted">Department</label>
        <select id="esc-dept">${Object.entries(DEPTS).map(([k, d]) => `<option value="${k}" ${k === (SPECIAL[r.skill] || (r.skill === 'billing' ? 'finance' : '')) ? 'selected' : ''}>${d.name} · ${d.hint}</option>`).join('')}</select>
        <label for="esc-comment" class="small muted">Internal comment for the receiving team (the customer never sees this)</label>
        <textarea id="esc-comment" placeholder="What do you need from them? Add anything they should know."></textarea>
        <div><button class="btn sec" type="button" data-act="escalate" data-k="${key(open)}">Escalate</button></div></div></details>`}
  </section>`;
  return head + `<section class="stack"><h2>Incoming handovers</h2><div class="inbox">${items}</div></section>` + detail;
}

function spark(vals) {
  const w = 220, h = 44, lo = 70, hi = 95, x = i => 4 + i * (w - 8) / (vals.length - 1), y = v => h - 6 - (v - lo) / (hi - lo) * (h - 12);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Final confirmation rate, last 7 clinic days: ${vals.join(', ')} percent">
    <polygon points="4,${h} ${pts} ${w - 4},${h}" fill="var(--accent-soft)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3.5" fill="var(--accent)"/></svg>`;
}

function viewOps() {
  const rows = B.map(b => ({ b, r: risk(b) }));
  const conf = rows.filter(x => ['confirmed', 'rescheduled'].includes(x.b.status)).length;
  const active = B.filter(b => b.status !== 'cancelled').length, cancelled = B.length - active;
  const noReply = rows.filter(x => x.b.status === 'pending').length;
  const withAgent = handovers().filter(h => !h.m.ai.route.resolved).length;
  const expected = rows.reduce((a, x) => a + x.r.score * 0.0045, 0);
  const lv = l => rows.filter(x => x.r.level === l).length;
  const shown = rows.filter(x => S.filter === 'all' || x.r.level === S.filter)
    .sort((p, q) => S.sort === 'risk' ? q.r.score - p.r.score : mins(p.b.time) - mins(q.b.time));
  const hist = [84, 79, 88, 81, 76, 83, 86];
  const pill = (k, label) => `<button class="pill" type="button" aria-pressed="${S.filter === k}" data-act="filter" data-k="${k}">${label}</button>`;
  return `
  <div class="row"><h1 style="font-size:22px;margin-right:auto">Tomorrow · Thursday 29 Oct</h1><span class="muted small">Reminders sent 09:00 · updated <span class="mono">${NOW}</span></span></div>
  <section class="kpis">
    <div class="card kpi"><h2>Confirmation rate</h2><div class="big">${pct(conf / active)} <small>${conf} of ${active}</small></div>${spark(hist)}${cancelled ? `<span class="small">${cancelled} cancelled, slot${cancelled > 1 ? 's' : ''} released for rebooking</span>` : ''}<span class="small muted">Final rate on the last 7 clinic days: ${Math.min(...hist)}–${Math.max(...hist)}%</span></div>
    <div class="card kpi"><h2>Expected no-shows</h2><div class="big mono">${expected.toFixed(1)} <small>of ${active}</small></div><div class="row">${chip(lv('high') + ' high', 'crit')}${chip(lv('medium') + ' medium', 'warn')}${chip(lv('low') + ' low', 'ok')}</div><span class="small muted">Sum of per-booking no-show probability</span></div>
    <div class="card kpi"><h2>Needs action</h2><div class="big mono">${noReply + withAgent}</div><span class="small">${noReply} with no reply · ${withAgent} waiting for an agent</span><span class="small muted">No-reply bookings get a call from reception at 15:00</span></div>
  </section>
  <div class="ops-grid">
    <section class="card stack">
      <div class="row"><h2 style="margin-right:auto">No-show risk per booking</h2>
        <label for="sort" class="sr">Sort</label><select id="sort" style="width:auto"><option value="risk" ${S.sort === 'risk' ? 'selected' : ''}>Highest risk first</option><option value="time" ${S.sort === 'time' ? 'selected' : ''}>By time</option></select></div>
      <div class="pills" role="group" aria-label="Filter by risk">${pill('all', 'All')}${pill('high', 'High')}${pill('medium', 'Medium')}${pill('low', 'Low')}</div>
      <div class="risk-list">${shown.map(({ b, r }) => `<details><summary>
          <span class="mono">${b.time}</span>
          <span class="nm"><b>${esc(b.name)}</b><small>${langChip(b.lang)}${SERVICES[b.svc].en}${b.newSlot ? ` · moved to ${b.newSlot.en}` : ''}</small></span>
          <span class="row" style="justify-content:flex-end">${riskChip(r)}</span></summary>
        <div class="drivers"><div class="row">${statusChip(b)}<span class="muted">${b.id}</span></div>
          <ul>${r.drivers.map(([n, w]) => `<li>${esc(w)} <span class="mono muted">(${n > 0 ? '+' : '−'}${Math.abs(n)})</span></li>`).join('')}</ul>
          <div><button class="link" type="button" data-act="openbooking" data-id="${b.id}">Open conversation</button></div></div>
        </details>`).join('') || '<p class="muted small">No bookings at this risk level.</p>'}</div>
    </section>
    <section class="card stack">
      <h2>Agent queue load</h2>
      <div class="legend"><span style="--c:var(--muted)">Other open chats</span><span style="--c:var(--accent)">Reminder handovers</span></div>
      <div>${AGENTS.map(a => {
        const own = openFor(a.id), l = a.base + own, ratio = l / a.cap, st = ratio >= 0.84 ? ['Full', 'crit'] : ratio >= 0.5 ? ['Busy', 'warn'] : ['Available', 'ok'];
        return `<div class="load-row"><div class="load-head"><b>${a.name}</b>${a.langs.map(langChip).join('')}${chip(st[0], st[1])}<span class="mono small">${l}/${a.cap}</span></div>
          <div class="lbar" role="img" aria-label="${l} of ${a.cap} conversations"><i style="width:${a.base / a.cap * 100}%;background:var(--muted)"></i><i style="width:${own / a.cap * 100}%;background:var(--accent)"></i></div>
          <span class="small muted">${a.skills.map(s => SKILL[s]).join(', ')}</span></div>`;
      }).join('')}</div>
      <span class="small muted">Median first response today: <span class="mono">6 min</span></span>
    </section>
    <section class="card stack">
      <h2>Escalation queues</h2>
      <span class="small muted">Internal notes are shown to the receiving team only, never to the customer.</span>
      <div>${Object.entries(DEPTS).map(([k, d]) => {
        const items = handovers().filter(h => h.m.ai.route.escal?.dept === k);
        return `<div class="dept"><div class="load-head"><b>${d.name}</b>${chip(items.length + ' open', items.length ? 'warn' : '')}<span class="small muted">SLA ${d.sla}</span></div>
          ${items.map(h => { const e = h.m.ai.route.escal; return `<div class="dept-item"><div class="row"><b>${esc(h.b.name)}</b>${langChip(h.m.ai.lang)}<span class="muted mono" style="margin-left:auto">${e.t}</span></div>
            <span>${e.comment ? esc(e.comment) : '<span class="muted">No comment added</span>'}</span><span class="muted">From ${esc(agentById(e.by).name)} · booking ${h.b.time}</span></div>`; }).join('') || `<span class="small muted">${d.hint}</span>`}</div>`;
      }).join('')}</div>
    </section>
  </div>`;
}

const VIEWS = { customer: viewCustomer, ai: viewAI, agent: viewAgent, ops: viewOps };

function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === S.tab ? 'page' : 'false'));
  $('#picker-row').hidden = S.tab === 'agent' || S.tab === 'ops';
  $('#booking').innerHTML = B.map(b => `<option value="${b.id}" ${b.id === S.sel ? 'selected' : ''}>${b.time} · ${b.name} · ${b.lang.toUpperCase()}</option>`).join('');
  const main = $('#main');
  main.className = 'wrap' + (S.tab === 'ops' ? ' wide' : '');
  main.innerHTML = VIEWS[S.tab]();
  const dot = $('#agent-dot'), n = handovers().filter(h => !h.m.ai.route.resolved).length;
  dot.hidden = !n; dot.textContent = n;
  const th = $('#thread'); if (th) th.scrollTop = th.scrollHeight;
}

function go(tab) {
  S.tab = tab; render(); window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + tab); } catch (e) {}
}

function send(text, o = {}) {
  const b = cur();
  if (S.typing || !text.trim()) return;
  const replies = processMsg(b, text.trim(), o);
  S.typing = b.id; S.aiMsg = null; render();
  setTimeout(() => {
    b.msgs.push(...replies); S.typing = null;
    const r = b.msgs.findLast(m => m.ai).ai.route;
    if (r.mode === 'handover') toast(`Handed over to ${agentById(r.agent).name}. See the Agent tab.`);
    render();
    if (o.button === 'question') $('#reply')?.focus();
  }, 850);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]');
  if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  const act = t.dataset.act, b = cur();
  if (act === 'quick') send(T[b.lang].quick[['confirm', 'reschedule', 'question'].indexOf(t.dataset.k)], { button: t.dataset.k });
  if (act === 'slot') {
    const s = SLOTS[+t.dataset.k]; b.newSlot = s; b.status = 'rescheduled';
    b.msgs.push({ from: 'customer', text: s[b.lang], t: NOW }, { from: 'bot', text: T[b.lang].moved(b, s[b.lang]), t: NOW });
    render(); toast(`${b.first} moved to ${s.en}`);
  }
  if (act === 'cancelchoice') {
    const L = T[b.lang], cancel = t.dataset.k === 'cancel';
    b.msgs.push({ from: 'customer', text: L.choice[cancel ? 0 : 1], t: NOW });
    if (cancel) { b.status = 'cancelled'; b.msgs.push({ from: 'bot', text: L.cancelled(b), t: NOW }); toast(`${b.first}’s booking cancelled · slot released`); }
    else { b.status = 'slots-offered'; b.msgs.push({ from: 'bot', text: L.resched(b), slots: true, t: NOW }); }
    render();
  }
  if (act === 'inspect') { S.aiMsg = +t.dataset.i; go('ai'); }
  if (act === 'aimsg') { S.aiMsg = +t.dataset.i; render(); }
  if (act === 'toagent') { const r = b.msgs[+t.dataset.i].ai.route; S.agent = r.agent; S.openH = b.id + ':' + t.dataset.i; go('agent'); }
  if (act === 'openh') { S.openH = t.dataset.k; render(); }
  if (act === 'filter') { S.filter = t.dataset.k; render(); }
  if (act === 'openbooking') { S.sel = t.dataset.id; S.aiMsg = null; go('customer'); }
  if (act === 'escalate') {
    const [id, i] = t.dataset.k.split(':'), m = B.find(x => x.id === id).msgs[+i], dept = $('#esc-dept').value;
    m.ai.route.escal = { dept, comment: $('#esc-comment').value.trim(), by: S.agent, t: NOW };
    render(); toast(`Escalated to ${DEPTS[dept].name}`);
  }
  if (act === 'sendreply') {
    const [id, i] = t.dataset.k.split(':'), bk = B.find(x => x.id === id), m = bk.msgs[+i], text = $('#agent-reply').value.trim();
    if (!text) return toast('Write a reply before sending.');
    m.ai.route.resolved = true;
    bk.msgs.push({ from: 'agent', agent: m.ai.route.agent, text, t: NOW });
    if (bk.status === 'with-agent') bk.status = 'agent-replied';
    render(); toast(`Sent to ${bk.first} by SMS`);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'booking') { S.sel = e.target.value; S.aiMsg = null; render(); }
  if (e.target.id === 'agent-sel') { S.agent = e.target.value; S.openH = null; render(); }
  if (e.target.id === 'sort') { S.sort = e.target.value; render(); }
  if (e.target.id === 'reassign' && e.target.value) {
    const [id, i] = e.target.dataset.k.split(':'), m = B.find(x => x.id === id).msgs[+i], to = agentById(e.target.value);
    m.ai.route.agent = to.id; S.openH = null; render(); toast(`Reassigned to ${to.name}`);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'compose') return;
  e.preventDefault(); const inp = $('#reply'); send(inp.value); inp.value = '';
});
$('#reset').addEventListener('click', () => { init(); render(); toast('Demo reset'); });

init();
const h = location.hash.slice(1);
if (VIEWS[h]) S.tab = h;
render();
</script>
</html>
